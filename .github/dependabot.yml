version: 2
registries:
  npm-npmjs:
    type: npm-registry
    url: https://registry.npmjs.org
    replaces-base: true
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  groups:
    production:
      dependency-type: production
      update-types:
      - minor
      - patch
    development:
      dependency-type: development
      update-types:
      - minor
      - patch
  open-pull-requests-limit: 0
  registries:
  - npm-npmjs
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  groups:
    actions:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  open-pull-requests-limit: 0
- package-ecosystem: swift
  directory: /apps/macos
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  groups:
    swift-deps:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  open-pull-requests-limit: 0
- package-ecosystem: swift
  directory: /apps/shared/MoltbotKit
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  groups:
    swift-deps:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  open-pull-requests-limit: 0
- package-ecosystem: swift
  directory: /Swabble
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  groups:
    swift-deps:
      patterns:
      - '*'
      update-types:
      - minor
