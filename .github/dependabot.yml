  open-pull-requests-limit: 0
- package-ecosystem: gradle
  directory: /apps/android
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  groups:
    android-deps:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  open-pull-requests-limit: 0
